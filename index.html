<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Chess Arena</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' } } } }
        }
    </script>

    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jQuery & Libraries -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <!-- ไฟล์ CSS ของเราเอง -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex justify-center p-4">

    <div class="max-w-6xl w-full flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-850 p-4 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex items-center gap-4">
                <div class="bg-indigo-600 p-3 rounded-lg shadow-indigo-500/50 shadow-lg">
                    <i class="fa-solid fa-chess-knight text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Elite Chess Arena</h1>
                    <p class="text-xs text-slate-400">Powered by Chess.js & Stockfish AI</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="soundBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-indigo-400"></i> Sound
                </button>
                <button id="newGameBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-bold shadow-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> New Game
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-col lg:flex-row gap-6">
            
            <!-- Left Column: Board -->
            <div class="flex-1 max-w-[600px] mx-auto lg:mx-0 flex flex-col gap-4">
                <div class="bg-slate-850 border border-slate-700 p-3 rounded-xl flex justify-between items-center shadow-md">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center">
                            <i class="fa-solid fa-robot text-slate-300"></i>
                        </div>
                        <div>
                            <div class="font-semibold" id="topPlayerName">AI (Medium)</div>
                            <div id="top-captured" class="flex h-6 mt-1"></div>
                        </div>
                    </div>
                    <div id="top-clock" class="font-mono text-lg font-bold bg-slate-900 px-3 py-1 rounded-md text-slate-400 border border-slate-700">10:00</div>
                </div>

                <div id="board" class="w-full shadow-2xl"></div>

                <div class="bg-slate-850 border border-slate-700 p-3 rounded-xl flex justify-between items-center shadow-md">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <div>
                            <div class="font-semibold" id="bottomPlayerName">You (White)</div>
                            <div id="bottom-captured" class="flex h-6 mt-1"></div>
                        </div>
                    </div>
                    <div id="bottom-clock" class="font-mono text-lg font-bold bg-slate-900 px-3 py-1 rounded-md text-emerald-400 border border-slate-700">10:00</div>
                </div>
            </div>

            <!-- Right Column: Settings & Info -->
            <div class="w-full lg:w-[400px] flex flex-col gap-5">
                
                <div class="bg-slate-850 border border-slate-700 p-5 rounded-xl shadow-md">
                    <h3 class="text-xs font-bold text-slate-400 tracking-wider mb-4">GAME CONFIGURATION</h3>
                    <div class="flex gap-4 mb-4">
                        <div class="flex-1">
                            <label class="block text-xs text-slate-500 mb-1">Time (Mins)</label>
                            <select id="timeControl" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2 focus:ring focus:ring-indigo-500 outline-none">
                                <option value="180">3 Min (Blitz)</option>
                                <option value="300">5 Min (Blitz)</option>
                                <option value="600" selected>10 Min (Rapid)</option>
                                <option value="1800">30 Min (Classic)</option>
                            </select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-500 mb-1">Board Theme</label>
                            <select id="boardTheme" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2 focus:ring focus:ring-indigo-500 outline-none">
                                <option value="slate">Slate (Default)</option>
                                <option value="green">Classic Green</option>
                                <option value="wood">Vintage Wood</option>
                                <option value="blue">Ocean Blue</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex gap-4 mb-4">
                        <div class="flex-1">
                            <label class="block text-xs text-slate-500 mb-1">Game Mode</label>
                            <select id="gameMode" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2 focus:ring focus:ring-indigo-500 outline-none">
                                <option value="ai">Player vs AI</option>
                                <option value="pvp">Player vs Player</option>
                            </select>
                        </div>
                        <div class="flex-1" id="difficultyContainer">
                            <label class="block text-xs text-slate-500 mb-1">AI Difficulty</label>
                            <select id="difficulty" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg p-2 focus:ring focus:ring-indigo-500 outline-none">
                                <option value="easy">Easy (~1000 ELO)</option>
                                <option value="medium" selected>Medium (~1600 ELO)</option>
                                <option value="hard">Hard (~2300+ ELO)</option>
                            </select>
                        </div>
                    </div>

                    <div class="flex gap-3 mt-5">
                        <button id="undoBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm font-medium transition">
                            <i class="fa-solid fa-rotate-left mr-1 text-amber-400"></i> Undo
                        </button>
                        <button id="hintBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm font-medium transition">
                            <i class="fa-solid fa-lightbulb mr-1 text-yellow-300"></i> Hint
                        </button>
                        <button id="pgnBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-lg text-sm font-medium transition">
                            <i class="fa-solid fa-download mr-1 text-emerald-400"></i> PGN
                        </button>
                    </div>
                </div>

                <div id="statusBanner" class="bg-indigo-900/30 border border-indigo-500/50 p-4 rounded-xl flex items-start gap-3">
                    <i class="fa-solid fa-circle-info text-indigo-400 mt-1"></i>
                    <div>
                        <div id="statusTitle" class="font-bold text-indigo-200">White's Turn</div>
                        <div id="statusDesc" class="text-sm text-indigo-300/80">Make your move.</div>
                    </div>
                </div>

                <div class="bg-slate-850 border border-slate-700 rounded-xl flex flex-col flex-1 shadow-md min-h-[250px]">
                    <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                        <h3 class="text-xs font-bold text-slate-400 tracking-wider">MOVE HISTORY</h3>
                        <span id="moveCount" class="text-xs text-slate-500">0 moves</span>
                    </div>
                    <div class="flex-1 overflow-y-auto p-4">
                        <table class="w-full text-sm text-left">
                            <thead class="text-slate-500 font-medium">
                                <tr><th class="pb-2 w-16">#</th><th class="pb-2 w-1/2">White</th><th class="pb-2 w-1/2">Black</th></tr>
                            </thead>
                            <tbody id="historyBody" class="text-slate-300"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 transition-opacity backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl transform scale-95 transition-transform duration-300">
            <i id="modalIcon" class="fa-solid fa-trophy text-6xl mb-4"></i>
            <h2 id="modalTitle" class="text-4xl font-black mb-2 uppercase tracking-widest text-slate-100">Game Over</h2>
            <p id="modalDesc" class="text-slate-400 text-lg mb-8 font-medium">White wins</p>
            <div class="flex gap-4">
                <button id="modalCloseBtn" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-3 px-4 rounded-lg transition">Close</button>
                <button id="modalPlayAgainBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-indigo-500/30 transition">Play Again</button>
            </div>
        </div>
    </div>

    <!-- ไฟล์ JavaScript ของเราเอง -->
    <script src="script.js"></script>
</body>
</html>
